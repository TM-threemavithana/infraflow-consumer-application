name: "Application Services CI"

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - "infraflow.config.yaml"
      - ".github/workflows/infraflow-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance-gate:
    name: "InfraFlow Governance Gate"
    uses: TM-threemavithana/infraflow/.github/workflows/reusable-tf-governance.yml@be51718f06a2662099500a710e93e6e8201b4f1c
    with:
      config-file: "infraflow.config.yaml"
      working-directory: "."
      platform-sha: "be51718f06a2662099500a710e93e6e8201b4f1c"
      expected-adapter: "azure"

  azure-speculative-plan:
    name: "Azure Speculative Plan (Cloud-Free)"
    needs: [governance-gate]
    uses: TM-threemavithana/infraflow/.github/workflows/reusable-tf-azure.yml@be51718f06a2662099500a710e93e6e8201b4f1c
    with:
      azure-subscription-id: "00000000-0000-0000-0000-000000000001"
      azure-resource-group-name: "rg-infraflow-dev"
      azure-storage-account-name: "stappinfraflowdev"
      azure-storage-container-name: "tfstate"
      azure-backend-key: "env/dev/terraform.tfstate"
      azure-region: "eastus"
      terraform-version: "1.10.4"
      working-directory: "terraform"
      environment: "dev"
      enable-azure-auth: false
